name: Release

# Tag-driven, so the artifacts always correspond to a commit that is in the
# history rather than to whatever a branch happened to hold at build time.
on:
  push:
    tags:
      - "v*"
  # Lets the bundles be built and inspected without tagging first.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple silicon only. The x86_64 Mac bundle is not built: macos-13
          # was retired on 2025-12-08, and the Intel runners replacing it go
          # the same way when macos-15 retires in autumn 2027. Intel Macs can
          # run the aarch64 build under Rosetta 2, which is the trade being
          # made here — a slower app for a shrinking group, rather than a
          # target whose runner is already on notice.
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      # Same webkit/gtk headers the test job needs, plus the AppImage tooling.
      - name: Install Linux build dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev file

      - name: Build the bundle
        run: pnpm tauri build --target ${{ matrix.target }}
        env:
          # Signing and notarisation, macOS only. Tauri signs when a certificate
          # is present and notarises when credentials are, so an unsigned build
          # still succeeds where the secrets are absent — a fork, or this repo
          # before they were added. That is deliberate: a missing secret should
          # not turn into a red build with an opaque cause.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # The Apple ID and team ID are not secret — the team ID is embedded in
          # every signed binary — so they may be repository variables. Accept
          # either, because a value set as a variable and read from `secrets`
          # is not an error: it is the empty string, and notarisation then
          # fails for a reason that names neither.
          APPLE_ID: ${{ vars.APPLE_ID || secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID || secrets.APPLE_TEAM_ID }}

      # Says plainly whether the bundle is signed and accepted, rather than
      # leaving it to be discovered by a user whose Mac refuses to open it.
      - name: Report signing status
        if: startsWith(matrix.os, 'macos')
        run: |
          APP=$(find "src-tauri/target/${{ matrix.target }}/release/bundle/macos" \
            -maxdepth 1 -name '*.app' | head -1)
          echo "bundle: $APP"
          codesign --verify --deep --strict --verbose=2 "$APP" || echo "NOT SIGNED"
          # The check Gatekeeper actually performs on another machine.
          spctl --assess --type execute --verbose "$APP" || echo "NOT ACCEPTED BY GATEKEEPER"

      - uses: actions/upload-artifact@v4
        with:
          name: dcmd-${{ matrix.target }}
          # Only the installable outputs; the unpacked .app and the intermediate
          # read-write dmg alongside it are not worth uploading.
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
          if-no-files-found: error

  publish:
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # A draft, deliberately. Nothing is public until someone has looked at the
      # bundles and pressed publish — and on macOS that includes checking what
      # an unsigned build does on a machine that did not compile it.
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/*
