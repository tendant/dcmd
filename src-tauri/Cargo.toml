[package]
name = "dcmd"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "dcmd_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
trash = "5"
# Used directly rather than via tauri-plugin-opener: the plugin calls
# open::that_detached, which does not wait for the launcher and so reports
# success even when nothing can open the file.
open = "5"

[target.'cfg(unix)'.dependencies]
# For renamex_np / renameat2: an atomic rename that refuses to clobber, which
# std does not expose.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# MoveFileExW without MOVEFILE_REPLACE_EXISTING, for the same reason.
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
