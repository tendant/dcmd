[package]
name = "dcmd"
version = "0.3.0"
description = "A keyboard-first dual-pane file manager"
authors = ["dcmd contributors"]
edition = "2021"
license = "MIT"
repository = "https://github.com/tendant/dcmd"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "dcmd_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
trash = "5"
# Preview sends file bytes over IPC. Already in the tree at this version, so a
# direct dependency adds no second copy.
base64 = "0.22"
# Used directly rather than via tauri-plugin-opener: the plugin calls
# open::that_detached, which does not wait for the launcher and so reports
# success even when nothing can open the file.
open = "5"
tauri-plugin-drag = "2.1.1"

# Remote browsing. Unix-only, because it drives the system ssh binary — which is
# the point: ~/.ssh/config, agent, ProxyJump and known_hosts all work without us
# reimplementing any of it.
[target.'cfg(unix)'.dependencies.openssh]
version = "0.11"
default-features = false
features = ["native-mux"]

[target.'cfg(unix)'.dependencies.openssh-sftp-client]
version = "0.15"
features = ["openssh"]

# ReadDir is a Stream rather than an iterator.
[target.'cfg(unix)'.dependencies.futures-util]
version = "0.3"
default-features = false

[target.'cfg(unix)'.dependencies.tokio]
version = "1"
# `time` for the deadline on connecting: ssh's own ConnectTimeout covers the TCP
# connect and nothing after it, so the rest needs bounding here.
features = ["sync", "process", "io-util", "macros", "time"]

[target.'cfg(unix)'.dependencies]
# For renamex_np / renameat2: an atomic rename that refuses to clobber, which
# std does not expose.
libc = "0.2"
# The generated ssh config that forces BatchMode on. Written per connection and
# deleted with it, so a stale one cannot outlive the process that reads it.
tempfile = "3"

[target.'cfg(windows)'.dependencies]
# MoveFileExW without MOVEFILE_REPLACE_EXISTING, for the same reason.
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem"] }

[features]
# The webview inspector. Always available in a debug build; this feature is what
# puts it in a release build, for diagnosing something that only reproduces
# there. It ships devtools to users, so it is off by default.
devtools = ["tauri/devtools"]

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
